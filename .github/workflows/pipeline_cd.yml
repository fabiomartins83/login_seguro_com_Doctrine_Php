name: Pipeline CD - Deploy do repositorio para servidor de hospedagem AlwaysData
on:
  workflow_run:
    workflows: ["Pipeline CI - Validar projeto PHP e subir ao repositório Github"] # Deve ser o nome exato definido no 'name:' do seu pipeline_ci.yml
    types:
      - completed
    branches: [ "main" ]

permissions:
  contents: read

# Evita dois deploys simultâneos
concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: false

jobs:
  deploy-alwaysdata:
    runs-on: ubuntu-latest
    # Só executa o deploy se o workflow de CI anterior foi concluído com SUCESSO
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      HOST: ${{ secrets.ALWAYSDATA_HOST }}
      SSH_USER: ${{ secrets.ALWAYSDATA_USER }}
      TARGET_DIR: ${{ secrets.ALWAYSDATA_TARGET_DIR }}

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4
        with:
          # Garante o checkout do commit exato validado pelo CI
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 2. Validar variáveis de ambiente e configurar SSH
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
        run: |
          test -n "$HOST"
          test -n "$SSH_USER"
          test -n "$TARGET_DIR"
          test -n "$SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

          cat > ~/.ssh/config <<EOF
          Host alwaysdata
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config
          ls -la ~/.ssh

      - name: 3. Validar chave SSH e testar conexão
        run: |
          echo "Linhas: $(wc -l < ~/.ssh/id_ed25519)"
          echo "Bytes: $(wc -c < ~/.ssh/id_ed25519)"
          echo "Primeira linha: $(head -n1 ~/.ssh/id_ed25519 | cut -c1-12)"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Chave privada válida"
          ssh alwaysdata "echo Conexao SSH ok em \$(pwd)"

      - name: 4. Sincronizar arquivos via rsync
        run: |
          test -f ~/.ssh/config
          test -n "$TARGET_DIR"
          ssh alwaysdata "mkdir -p '${TARGET_DIR}'"
          rsync -avz --delete --omit-dir-times \
            -e "ssh" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='vendor/' \
            --exclude='*.sqlite' \
            --exclude='*.db' \
            --exclude='.env' \
            ./ "alwaysdata:${TARGET_DIR}"

      - name: 5. Instalar dependências do Composer no servidor
        run: |
          ssh alwaysdata "cd '${TARGET_DIR}' && composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist"

      - name: 6. Limpar credenciais temporárias SSH
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519 ~/.ssh/config ~/.ssh/known_hosts