name: CD - Deploy do repositório para servidor de hospedagem AlwaysData

on:
  workflow_run:
    workflows: ["Pipeline CI - Validar projeto PHP e subir ao repositório Github"] # Deve ser o nome exato definido no 'name:' do seu pipeline_ci.yml
    types:
      - completed
    branches: [ "main" ]

permissions:
  contents: read

# Evita dois deploys simultâneos
concurrency:
  group: deploy-alwaysdata
  cancel-in-progress: false

jobs:
  deploy-alwaysdata:
    runs-on: ubuntu-latest
    # Só executa o deploy se o workflow de CI anterior foi concluído com SUCESSO
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    env:
      HOST: ${{ secrets.ALWAYSDATA_HOST }}
      SSH_USER: ${{ secrets.ALWAYSDATA_USER }}
      TARGET_DIR: ${{ secrets.ALWAYSDATA_TARGET_DIR }}

    steps:
      - name: 1. Baixar código do repositório
        uses: actions/checkout@v4
        with:
          # Sem isso, o workflow_run faz checkout da HEAD da branch padrão,
          # e não necessariamente do commit que o CI validou.
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: 2. Configurar chave SSH
        env:
          SSH_KEY: ${{ secrets.ALWAYSDATA_SSH_KEY }}
          # Passa a chave por variável de ambiente (mais seguro que interpolar no script)
          # e remove possíveis CRLF de quem colou o segredo no Windows.
          # Alias único para rsync e ssh usarem a mesma chave/usuário
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host alwaysdata
            HostName $HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: 3. Validar chave SSH
        run: |
          echo "Linhas: $(wc -l < ~/.ssh/id_ed25519)"
          echo "Bytes: $(wc -c < ~/.ssh/id_ed25519)"
          echo "Primeira linha: $(head -n1 ~/.ssh/id_ed25519 | cut -c1-12)"
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Chave privada válida"

      - name: 4. Sincronizar arquivos via rsync (excluindo arquivos de dev/git)
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='tests/' \
            --exclude='vendor/' \
            --exclude='*.sqlite' \
            --exclude='*.db' \
            --exclude='.env' \
            ./ "alwaysdata:${TARGET_DIR}"

      - name: 5. Instalar dependências do Composer no servidor
        run: |
          ssh alwaysdata "cd '${TARGET_DIR}' && composer install --no-dev --optimize-autoloader --no-interaction"