name: Pipeline CI - Validar projeto PHP e subir ao repositório Github

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  php-ci:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, mbstring
          tools: composer:v2
          coverage: none

      - name: 3. Validate composer files
        run: composer validate

      - name: 4. Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: 5. Lint PHP syntax
        run: find src public tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: 6. Run unit test script
        run: php tests/teste_unitario.php
